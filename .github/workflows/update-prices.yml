name: Atualizar preços

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Buscar cotações e notícias
        run: npm run update

      - name: Commit se houver mudança
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/noticias.json data/historico.json index.html robots.txt sitemap.xml CNAME
          if git diff --staged --quiet; then
            echo "Sem alterações"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: atualiza preços, notícias, histórico e SEO"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push com GITHUB_TOKEN não dispara outros workflows (evita loop).
      # Por isso o deploy do Pages precisa ser acionado explicitamente.
      - name: Publicar no GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy GitHub Pages" --ref "${{ github.ref_name }}"
