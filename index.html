<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Preço médio da arroba do boi por estado brasileiro."
    />
    <title>Preço do Boi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Brygada+1918:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <header class="hero">
      <p class="brand">Preço do Boi</p>
      <h1>Arroba do gado em cada estado</h1>
      <p class="lede">
        Média da arroba do gado, atualizada a partir das praças brasileiras.
      </p>
      <div class="hero-actions">
        <p id="status-atualizacao" class="meta"></p>
        <button id="btn-atualizar" class="btn" type="button" hidden>
          Atualizar Dados
        </button>
        <p id="msg-atualizando" class="status-live" hidden aria-live="polite">
          Atualizando...
        </p>
      </div>
      <img
        class="hero-silhueta"
        src="assets/gado-silhueta.png"
        alt=""
        width="640"
        height="360"
      />
    </header>

    <main>
      <section class="nacional" aria-labelledby="titulo-nacional">
        <p class="eyebrow">Cantinho nacional</p>
        <h2 id="titulo-nacional">Média Brasil</h2>
        <div class="nacional-nums">
          <div>
            <span class="label">Arroba</span>
            <strong id="media-arroba">—</strong>
          </div>
        </div>
        <p id="fonte" class="meta fonte"></p>
      </section>

      <section class="estados" aria-labelledby="titulo-estados">
        <div class="estados-head">
          <h2 id="titulo-estados">Preços por estado</h2>
          <label class="busca">
            <span class="sr-only">Filtrar estado</span>
            <input
              id="filtro"
              type="search"
              placeholder="Buscar estado ou UF..."
              autocomplete="off"
            />
          </label>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Estado</th>
                <th>UF</th>
                <th>Arroba (R$)</th>
                <th>Origem</th>
              </tr>
            </thead>
            <tbody id="lista-estados"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="foot">
      <p>
        Dados de referência via
        <a href="https://agrodocai.com.br/api-docs" rel="noopener noreferrer"
          >AgroDoc AI</a
        >
        (CEPEA/ESALQ). Atribuição CC-BY-4.0.
      </p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
