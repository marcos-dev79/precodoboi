<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portal da arroba do boi: preços por estado e notícias de pecuária."
    />
    <title>Preço do Boi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Brygada+1918:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <header class="masthead">
      <div class="masthead-inner">
        <div class="masthead-brand">
          <p class="brand">Preço do Boi</p>
          <p class="tagline">Portal da pecuária · arroba e notícias</p>
        </div>
        <div class="masthead-market">
          <span class="label">Média Brasil</span>
          <strong id="media-arroba">—</strong>
          <span class="unit">/@</span>
        </div>
      </div>
      <div class="masthead-bar">
        <p id="status-atualizacao" class="meta"></p>
        <button id="btn-atualizar" class="btn" type="button" hidden>
          Atualizar Dados
        </button>
        <p id="msg-atualizando" class="status-live" hidden aria-live="polite">
          Atualizando...
        </p>
      </div>
    </header>

    <main class="portal">
      <section class="noticias" aria-labelledby="titulo-noticias">
        <div class="section-head">
          <h1 id="titulo-noticias">Pecuária agora</h1>
          <p class="meta" id="noticias-fonte"></p>
        </div>

        <div id="noticias-grid" class="noticias-grid" aria-live="polite">
          <p class="meta">Carregando notícias...</p>
        </div>
      </section>

      <aside class="mercado" aria-labelledby="titulo-estados">
        <div class="section-head">
          <h2 id="titulo-estados">Mercado por estado</h2>
          <label class="busca">
            <span class="sr-only">Filtrar estado</span>
            <input
              id="filtro"
              type="search"
              placeholder="Buscar UF..."
              autocomplete="off"
            />
          </label>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Estado</th>
                <th>Arroba</th>
                <th>Origem</th>
              </tr>
            </thead>
            <tbody id="lista-estados"></tbody>
          </table>
        </div>
        <p id="fonte" class="meta fonte"></p>
      </aside>

      <section class="embrapa" aria-labelledby="titulo-embrapa">
        <div class="section-head">
          <h2 id="titulo-embrapa">Embrapa</h2>
          <p class="meta" id="embrapa-fonte"></p>
        </div>
        <div id="embrapa-lista" class="embrapa-lista" aria-live="polite">
          <p class="meta">Carregando notícias da Embrapa...</p>
        </div>
      </section>
    </main>

    <footer class="foot">
      <p>
        Preços via
        <a href="https://agrodocai.com.br/api-docs" rel="noopener noreferrer"
          >AgroDoc AI</a
        >
        (CEPEA/ESALQ). Notícias via
        <a href="https://www.canalrural.com.br/pecuaria/" rel="noopener noreferrer"
          >Canal Rural</a
        >
        e
        <a href="https://www.embrapa.br/noticias-rss" rel="noopener noreferrer"
          >Embrapa</a
        >.
      </p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
